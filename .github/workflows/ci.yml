name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch/PR cancels the older run instead of stacking up (runners are limited).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      # --no-fail-fast: one failing crate must not hide failures in the others.
      - run: cargo test --workspace --locked --no-fail-fast
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generated TypeScript API files are up to date
        if: runner.os == 'Linux'
        run: |
          KORA_UPDATE_TS=1 cargo test -p kora-web --locked --test api_ts
          git diff --exit-code -- web/src/api/generated || { echo "::error::web/src/api/generated is out of date. Run: KORA_UPDATE_TS=1 cargo test -p kora-web --test api_ts, and commit the result."; exit 1; }
      - name: install.sh (shellcheck + tests against a local fake release)
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh scripts/install.sh
          shellcheck -s bash scripts/test-install.sh
          bash scripts/test-install.sh
      - name: install.ps1 (syntax check + PSScriptAnalyzer when available)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            # Write-Host is deliberate in an installer that talks to a person.
            $found = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -ExcludeRule PSAvoidUsingWriteHost
            $found | Format-Table -AutoSize | Out-String | Write-Host
            if ($found | Where-Object Severity -eq 'Error') { exit 1 }
          } else {
            Write-Host 'PSScriptAnalyzer is not installed on this runner: syntax check only.'
          }

  web:
    name: panel UI (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
