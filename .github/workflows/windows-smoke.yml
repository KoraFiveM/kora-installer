# Real Windows runtime checks on an ephemeral admin VM (windows-latest). Kept apart from ci.yml
# so the main CI stays fast. Uses a fake Cfx key only; no secrets.
name: Windows smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Three independent jobs run in parallel on separate Windows VMs, so a failure in one step no longer hides the
# result of the others (a failed step used to skip everything after it).
concurrency:
  # A newer push to the same branch/PR cancels the older run instead of stacking up (runners are limited).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  basics:
    name: "basics: --version, install.ps1, dev dry run, self-update, own git and gh, saved keys"
    runs-on: windows-latest
    timeout-minutes: 45
    # The GitHub Windows runner is an elevated administrator account; kora panel refuses to start
    # elevated unless this is set. Real installs run as a normal account.
    env:
      KORA_ALLOW_ROOT_PANEL: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke
      - name: "Build kora.exe"
        run: |
          cargo build --release --locked -p kora-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: "1. --version and no-TTY install error"
        timeout-minutes: 10
        run: ./scripts/smoke/01-build.ps1
      - name: "2a. PSScriptAnalyzer on install.ps1 (all rules except Write-Host)"
        timeout-minutes: 10
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $f = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -ExcludeRule PSAvoidUsingWriteHost
          $f | Format-Table -AutoSize | Out-String | Write-Host
          if ($f) { throw "PSScriptAnalyzer: $(@($f).Count) finding(s)" }
      - name: "2b. install.ps1 against a local fake release"
        timeout-minutes: 10
        run: ./scripts/smoke/02-install-ps1.ps1
      - name: "6. Dev mode dry run"
        timeout-minutes: 10
        run: ./scripts/smoke/06-dev-dry-run.ps1
      - name: "10. kora self-update (local fake release: replace while running, checksum mismatch, no asset, offline, .old cleanup)"
        run: ./scripts/smoke/10-selfupdate.ps1
      - name: "11. Kora's own git and gh (download, checksum, run without PATH, uninstall)"
        timeout-minutes: 15
        run: ./scripts/smoke/11-tools.ps1
      - name: "12. Saved licence keys (secrets.json permissions, masking, named install)"
        timeout-minutes: 10
        run: ./scripts/smoke/12-keys.ps1
      - name: "13. Service building blocks on Windows (privsvc: pipe rights, ownership, update rollback, caller policy)"
        timeout-minutes: 15
        run: |
          cargo test --locked -p kora-core -- privsvc system_ops
          if ($LASTEXITCODE -ne 0) { throw 'privsvc unit tests failed' }
      - name: Collect logs
        if: always()
        run: |
          foreach ($p in 'C:\kora-smoke\srv\.kora', "$env:LOCALAPPDATA\Kora") { if (Test-Path $p) { Write-Host "== $p"; Get-ChildItem $p -Recurse -File | Select-Object -First 40 FullName } }

  install-service:
    name: "install + service + firewall + uninstall"
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke
      - name: "Build kora.exe"
        run: |
          cargo build --release --locked -p kora-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: "3. Production install (tiny catalog, no service)"
        timeout-minutes: 10
        run: ./scripts/smoke/03-install.ps1
      - name: "4. Service + firewall: start/stop/restart, txAdmin answers, uninstall removes everything"
        timeout-minutes: 10
        run: ./scripts/smoke/04-service.ps1
      - name: "4b. Auto-update scheduled task (real schtasks create, query, delete)"
        timeout-minutes: 10
        run: |
          cargo test --locked -p kora-core real_windows_scheduled_task -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'scheduled task test failed' }
      - name: "7. Install --start: the installer starts FXServer, txAdmin answers, it outlives the installer, kora stop/start/delete"
        timeout-minutes: 12
        run: ./scripts/smoke/07-start.ps1
      - name: "8. kora schedule show/set/off (installing user and SYSTEM, real Task Scheduler)"
        run: ./scripts/smoke/08-schedule.ps1
      - name: Collect logs
        if: always()
        run: |
          foreach ($p in 'C:\kora-smoke\srv\.kora', 'C:\kora-smoke\srv-start\.kora', "$env:LOCALAPPDATA\Kora") { if (Test-Path $p) { Write-Host "== $p"; Get-ChildItem $p -Recurse -File | Select-Object -First 40 FullName } }
          if (Test-Path 'C:\kora-smoke\srv-start\.kora\server.log') { Get-Content 'C:\kora-smoke\srv-start\.kora\server.log' -Tail 60 }

  mariadb:
    name: "MariaDB: existing server, then Kora's own (--db install)"
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke
      - name: "Build kora.exe"
        run: |
          cargo build --release --locked -p kora-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: "5. MariaDB: existing MySQL server, then Kora's own MariaDB (--db install) and cleanup"
        timeout-minutes: 25
        run: ./scripts/smoke/05-mariadb.ps1
      - name: Collect logs
        if: always()
        run: |
          foreach ($p in 'C:\kora-smoke\srv\.kora', "$env:LOCALAPPDATA\Kora") { if (Test-Path $p) { Write-Host "== $p"; Get-ChildItem $p -Recurse -File | Select-Object -First 40 FullName } }

  app:
    name: "app: per-user shortcuts, status, uninstall, tidying the old machine-wide app"
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke
      - name: "Build kora.exe"
        run: |
          cargo build --release --locked -p kora-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: "9. Kora shortcuts: per-user install, status, uninstall; tidying up the old machine-wide app"
        timeout-minutes: 10
        run: ./scripts/smoke/09-app.ps1

  msi:
    name: "msi: install for real, the service from standard accounts, refusals, upgrade, uninstall"
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke
      - name: "Build kora.exe"
        run: |
          cargo build --release --locked -p kora-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: "Install the WiX tool (fetched here, pinned, not vendored)"
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'wix install failed' }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - name: "Build two MSIs (an older and a newer version) from the same program"
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          ./packaging/windows/build-msi.ps1 -Exe target/release/kora.exe -Version 0.0.1 -Out dist/old.msi
          ./packaging/windows/build-msi.ps1 -Exe target/release/kora.exe -Version 0.0.2 -Out dist/new.msi
      - name: "14. MSI: install, service from standard accounts (one allowed, one not), refusals, upgrade, uninstall"
        timeout-minutes: 20
        run: ./scripts/smoke/14-msi.ps1 -Msi dist/new.msi -OldMsi dist/old.msi

