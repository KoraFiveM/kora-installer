name: Supply chain
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories appear without any code change
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch/PR cancels the older run instead of stacking up (runners are limited).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
  npm-audit:
    name: npm audit (panel UI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Lockfile is in sync and installs without scripts
        run: npm ci --ignore-scripts
      - name: No known high or critical advisories in what ships
        run: npm audit --omit=dev --audit-level=high
  pinned-actions:
    name: third-party actions pinned by commit SHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every action in every workflow is pinned to a commit SHA
        # A tag can be moved to other code by whoever controls the action; a full commit SHA cannot.
        # Pin as `owner/repo@<40-hex SHA> # vX.Y.Z` (git ls-remote https://github.com/owner/repo 'refs/tags/vX.Y.Z*').
        run: |
          bad="$(grep -nE '^\s*-?\s*uses:\s*[^./][^@ ]*@' .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | grep -vE '@[0-9a-f]{40}(\s|$)' || true)"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | while IFS= read -r l; do
              echo "::error file=${l%%:*}::not pinned to a commit SHA: ${l#*:}"
            done
            exit 1
          fi
          echo "Every action is pinned to a commit SHA."
