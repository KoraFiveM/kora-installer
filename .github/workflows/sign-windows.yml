# Authenticode-sign the Windows files of a release with SignPath (free code signing for open-source projects), from
# an unsigned workflow artifact, and put the SIGNED files back under the same artifact name, with fresh `.sha256`
# files, so everything after it (verification, build provenance attestation, publishing, self-update) sees only the
# signed files. See docs/release-signing.md for the whole picture, the owner's steps and the release.yml snippet.
#
# * A no-op with a notice until the owner has finished the SignPath application and added the secret and variables
#   below: releases keep working unsigned. With `require-signing: true` a missing setup fails instead.
# * Once configured it NEVER ships unsigned by accident: a rejected, timed-out or unverifiable signing fails the job.
# * Signs every *.exe and *.msi in the artifact (the SignPath artifact configuration in .signpath/ lists them).
#   An MSI that embeds kora.exe must be built from the already-SIGNED exe: call this workflow once for the exe's
#   artifact, build the MSI from the signed result, then call it again for the MSI's artifact.
#
# Needs (set by the owner, none of it exists yet):
#   secret    SIGNPATH_API_TOKEN              API token of a SignPath user with submitter rights on the signing policy
#   variable  SIGNPATH_ORGANIZATION_ID        the organization ID shown in SignPath
#   variable  SIGNPATH_PROJECT_SLUG           e.g. kora-installer
#   variable  SIGNPATH_SIGNING_POLICY_SLUG    e.g. release-signing
#   variable  SIGNPATH_ARTIFACT_CONFIG_SLUG   (optional) the artifact configuration; default: the project's default one
# Every action is pinned to a full commit SHA (checked by supply-chain.yml).
name: Sign Windows files
on:
  workflow_call:
    inputs:
      unsigned-artifact:
        description: "Name of the workflow artifact that holds the unsigned .exe/.msi (and their .sha256 files). It is replaced by the signed version."
        required: true
        type: string
      require-signing:
        description: "Fail when signing is not configured (default: skip with a notice)."
        type: boolean
        default: false
      expected-publisher:
        description: "Text the signer certificate's subject must contain."
        type: string
        default: "SignPath Foundation"
      approval-timeout-seconds:
        description: "How long to wait for the maintainer to approve the signing request in SignPath."
        type: number
        default: 14400
    secrets:
      SIGNPATH_API_TOKEN:
        required: false
    outputs:
      signed:
        description: "true when the files were signed, false when signing is not configured"
        value: ${{ jobs.sign.outputs.signed }}
permissions:
  contents: read
jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read   # SignPath's connector reads this run's details and downloads the unsigned artifact
    outputs:
      signed: ${{ steps.done.outputs.signed }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Is signing configured?
        id: cfg
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          REQUIRE: ${{ inputs.require-signing }}
        run: |
          $missing = @()
          if (-not $env:TOKEN) { $missing += 'secret SIGNPATH_API_TOKEN' }
          if (-not $env:ORG) { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:PROJECT) { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not $env:POLICY) { $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }
          if ($missing.Count -eq 0) { "configured=true" >> $env:GITHUB_OUTPUT; return }
          "configured=false" >> $env:GITHUB_OUTPUT
          $msg = "Windows signing is not set up yet (missing: $($missing -join ', ')). The files are released UNSIGNED. See docs/release-signing.md."
          if ($env:REQUIRE -eq 'true') { Write-Host "::error title=Signing required but not configured::$msg"; exit 1 }
          Write-Host "::notice title=Windows files are not signed::$msg"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.cfg.outputs.configured == 'true'
        with:
          name: ${{ inputs.unsigned-artifact }}
          path: in

      - name: Pick the files to sign and check their metadata (SignPath enforces it too)
        id: pick
        if: steps.cfg.outputs.configured == 'true'
        run: |
          $files = @(Get-ChildItem in -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($files.Count -eq 0) { throw "no .exe or .msi in the artifact '${{ inputs.unsigned-artifact }}'" }
          $version = '0'
          foreach ($f in $files) {
            $already = Get-AuthenticodeSignature -FilePath $f.FullName
            if ($already.Status -ne 'NotSigned') { throw "$($f.Name) already has a signature ($($already.Status)): refusing to sign twice" }
            if ($f.Extension -eq '.exe') {
              $vi = (Get-Item $f.FullName).VersionInfo
              Write-Host "$($f.Name): ProductName='$($vi.ProductName)' ProductVersion='$($vi.ProductVersion)' FileVersion='$($vi.FileVersion)'"
              if ($vi.ProductName -ne 'Kora') { throw "$($f.Name): ProductName is '$($vi.ProductName)', the signing configuration requires 'Kora' (crates/kora-cli/build.rs)" }
              if (-not $vi.ProductVersion) { throw "$($f.Name) has no ProductVersion" }
              $version = $vi.ProductVersion
            }
          }
          New-Item -ItemType Directory -Force -Path to-sign | Out-Null
          foreach ($f in $files) { Copy-Item $f.FullName to-sign/ }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "signing: $(($files | ForEach-Object Name) -join ', ') (version $version)"

      # The connector only accepts an artifact stored by actions/upload-artifact in THIS run (it checks that).
      - name: Store the unsigned files for SignPath
        id: upload
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not named kora-*: release.yml's verify job downloads `kora-*` and must never see the unsigned copy.
          name: signpath-input-${{ inputs.unsigned-artifact }}
          path: to-sign/*
          if-no-files-found: error
          retention-days: 3

      - name: Submit the signing request (a maintainer approves it in SignPath)
        if: steps.cfg.outputs.configured == 'true'
        uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: ${{ inputs.approval-timeout-seconds }}
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.pick.outputs.version }}"

      - name: Verify every signature, then rebuild the checksums from the SIGNED files
        if: steps.cfg.outputs.configured == 'true'
        env:
          PUBLISHER: ${{ inputs.expected-publisher }}
        run: |
          $signed = @(Get-ChildItem signed -File -Recurse)
          if ($signed.Count -eq 0) { throw 'SignPath returned no files' }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item in/* out/ -Recurse -Force
          foreach ($s in $signed) {
            $orig = Join-Path in $s.Name
            if (-not (Test-Path $orig)) { throw "SignPath returned a file that was not submitted: $($s.Name)" }
            $sig = Get-AuthenticodeSignature -FilePath $s.FullName
            Write-Host "$($s.Name): status=$($sig.Status) signer='$($sig.SignerCertificate.Subject)' timestamp=$($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($s.Name): signature status is $($sig.Status): $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notlike "*$($env:PUBLISHER)*") { throw "$($s.Name): signed by '$($sig.SignerCertificate.Subject)', expected a subject containing '$($env:PUBLISHER)'" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "$($s.Name): no timestamp, the signature would stop verifying when the certificate expires" }
            if ($s.Length -le (Get-Item $orig).Length) { throw "$($s.Name): not larger than the unsigned file, so nothing was embedded" }
            if ($signtool) {
              & $signtool.FullName verify /pa /v $s.FullName
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $($s.Name)" }
            }
            else { Write-Host '::notice::signtool.exe not found on this runner; Get-AuthenticodeSignature was the only check' }
            # (kora-desktop.exe is the tray app: it has no `--version` of the kora kind)
            if ($s.Extension -eq '.exe' -and $s.Name -notlike 'kora-desktop*') {
              $v = ((& $s.FullName --version) -join '').Trim()
              Write-Host "$($s.Name) --version: $v"
              if ($v -notmatch '^kora \d+\.\d+\.\d+') { throw "the signed $($s.Name) does not run or reports '$v'" }
            }
            Copy-Item $s.FullName (Join-Path out $s.Name) -Force
            # The checksum file must describe the SIGNED bytes (self-update and install.ps1 hash the whole file).
            $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path out $s.Name)).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText((Join-Path (Resolve-Path out).Path "$($s.Name).sha256"), "$hash  $($s.Name)`n", (New-Object System.Text.UTF8Encoding($false)))
            Write-Host "$($s.Name).sha256 = $hash"
          }
          # Nothing in the output may still carry the old hash.
          foreach ($c in Get-ChildItem out -Filter *.sha256) {
            $name = $c.Name -replace '\.sha256$', ''
            $f = Join-Path out $name
            if (Test-Path $f) {
              $want = ((Get-Content $c.FullName -Raw).Trim() -split '\s+')[0]
              $have = (Get-FileHash -Algorithm SHA256 -Path $f).Hash.ToLowerInvariant()
              if ($want -ne $have) { throw "$($c.Name) does not match $name" }
            }
          }

      # Same name as the build job's artifact: later jobs download it as before and get the signed files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cfg.outputs.configured == 'true'
        with:
          name: ${{ inputs.unsigned-artifact }}
          path: out/*
          overwrite: true
          if-no-files-found: error

      - name: Result
        id: done
        run: |
          "signed=${{ steps.cfg.outputs.configured }}" >> $env:GITHUB_OUTPUT
