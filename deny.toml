# cargo-deny configuration. Run: cargo deny check
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Advisories that appeared after the dependencies were chosen (RUSTSEC-2026-03xx, the 2026 constant-time ones). Each
# is in a crate pulled in by a library we use, none has a fix we can reach (`cargo update` finds nothing newer), and
# each is ignored for a stated reason, never silently. Re-check when age, webauthn-rs, secret-service move: remove
# an entry the moment its crate can be upgraded (cargo-deny warns about entries that no longer match).
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing, via p256 0.13 inside age's hpke: Kora only uses age's passphrase (scrypt) recipient (backup/crypt.rs), the p256/hpke code is never run" },
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.19 Marvin timing, pinned by webauthn's crypto-glue: Kora only VERIFIES attestation signatures with public keys, it never signs or decrypts with an RSA private key" },
  { id = "RUSTSEC-2026-0370", reason = "zbus_names unmaintained, via secret-service (system keychain on Linux): no safe upgrade exists; replace secret-service when it moves to zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "zvariant unmaintained, via secret-service: same as RUSTSEC-2026-0370" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, via secret-service: same as RUSTSEC-2026-0370" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained, a build-time macro dependency of age's translations (i18n-config): not in the shipped code path" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing this project under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",   # webpki-roots data (permissive)
  "bzip2-1.0.6",   # libbz2-rs-sys via sevenz-rust2 (BSD-style, permissive)
]
confidence-threshold = 0.9
# MPL-2.0 is file-level copyleft: using these crates unmodified as dependencies puts no condition on Kora's own
# source (Apache-2.0); only changes to the crates' own files would have to be shared. Allowed for the WebAuthn
# (passkey) crates and nothing else.
exceptions = [
  { allow = ["MPL-2.0"], crate = "webauthn-rs" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-core" },
  { allow = ["MPL-2.0"], crate = "webauthn-rs-proto" },
  { allow = ["MPL-2.0"], crate = "webauthn-attestation-ca" },
  { allow = ["MPL-2.0"], crate = "crypto-glue" },
  { allow = ["MPL-2.0"], crate = "webauthn-authenticator-rs" }, # dev-dependency: a software passkey for the tests
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
