[package]
name = "kora-core"
description = "Kora installer/manager core: step engine, state, and (stubbed) subsystems"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bcrypt = "0.19.3"
getrandom = "0.4.3"
hex = "0.4.3"
serde.workspace = true
serde_json.workspace = true
sevenz-rust2 = "0.25"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror.workspace = true
ureq = "2"
xz2 = "0.1.7"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[features]
# `kora_core::api::fake::FakeBackend` for other crates' tests.
fake = []

[dev-dependencies]
tempfile.workspace = true

[target."cfg(unix)".dependencies]
libc = "0.2.191"
signal-hook = "0.4.6"

[target."cfg(windows)".dependencies]
windows-service = "0.8"
