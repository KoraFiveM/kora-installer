name: Bug report
description: Something went wrong while installing or managing a server
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 23H2 / Ubuntu 24.04 / Debian 12
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `kora --version`
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the command you ran or the wizard step you were on.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Paste the content of the failure screen's **Copy details** button, or the end of `<server folder>/.kora/install.log`.
        **Remove secrets first**: licence keys, passwords, tokens.
      render: text
  - type: checkboxes
    id: secrets
    attributes:
      label: Checks
      options:
        - label: I removed licence keys, passwords and tokens from everything I pasted.
          required: true
