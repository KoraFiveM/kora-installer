# TEMPORARY (branch nx/ci-win only; removed before the report): only the Windows MSI / administrator-service jobs,
# built once, on every push, newer pushes cancel older runs.
name: ci-win fast
on:
  push:
    branches: [nx/ci-win, "nx/ci-win-try-*"]
permissions:
  contents: read
concurrency:
  group: ci-win-fast-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: smoke
      - name: Build kora.exe and the desktop app
        run: |
          cargo build --release --locked -p kora-cli
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          cargo build --release --locked --manifest-path crates/kora-desktop/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }
      - name: Build the MSIs (WiX compile: the cheapest check)
        run: |
          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'wix install failed' }
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          ./packaging/windows/build-msi.ps1 -Exe target/release/kora.exe -Version 0.0.1 -Out dist/old.msi
          ./packaging/windows/build-msi.ps1 -Exe target/release/kora.exe -DesktopExe crates/kora-desktop/target/release/kora-desktop.exe -Version 0.0.2 -Out dist/new.msi
          Copy-Item dist/old.msi target/release/kora-windows-x86_64.msi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kora-fast
          path: |
            target/release/kora.exe
            target/release/kora-windows-x86_64.msi
            dist/old.msi
            dist/new.msi
          if-no-files-found: error
          retention-days: 1

  probe:
    name: probe (install, service answers) first
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kora-fast
          path: .
      - name: install old.msi with ALLOWUSERS and look at what hangs
        run: ./scripts/smoke/ci-win-probe.ps1 -Msi dist/old.msi

  msi:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kora-fast
          path: .
      - name: "14. MSI"
        timeout-minutes: 25
        run: ./scripts/smoke/14-msi.ps1 -Msi dist/new.msi -OldMsi dist/old.msi

  uac:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kora-fast
          path: .
      - name: "15. Installer and service UAC scenarios (hosted)"
        timeout-minutes: 25
        run: ./scripts/smoke/15-installer-uac.ps1 -Mode Hosted -Msi target/release/kora-windows-x86_64.msi
