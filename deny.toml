# cargo-deny configuration. Run: cargo deny check
[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Justified exceptions (revisit when fixed upstream):
ignore = [
  # sevenz-rust: path traversal is in its own `decompress_impl`. Kora does not call it: crates/kora-core/src/artifacts/extract.rs
  # reads entries with `for_each_entries` and validates every path (`clean_name`, `claim`) before writing.
  { id = "RUSTSEC-2026-0245", reason = "vulnerable decompress_impl is not used; kora validates entry paths itself" },
  { id = "RUSTSEC-2026-0246", reason = "sevenz-rust unmaintained; migrate to sevenz-rust2 (tracked)" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; build-time macro pulled in by ratatui 0.29" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing this project under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",   # webpki-roots data (permissive)
  "BSL-1.0",   # clipboard-win (Boost license, permissive)
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
