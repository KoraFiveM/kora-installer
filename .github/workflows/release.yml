# Release. Binaries are built from source in CI, including the panel UI (web/), and ship with a
# .sha256 next to each one and a signed build provenance attestation (no Authenticode signature yet).
# Every action is pinned to a full commit SHA (checked by supply-chain.yml).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the (draft) GitHub release. Only works when run on a v* tag. Leave false to rehearse the build and checks."
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            bin: kora
            name: kora-linux-x86_64
          - os: windows-latest
            bin: kora.exe
            name: kora-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the panel UI (embedded in the binary)
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: The UI build exists and has no mock data
        shell: bash
        run: |
          [ -s web/dist/index.html ] || { echo "web/dist/index.html is missing"; exit 1; }
          if grep -rl "mock backend" web/dist; then echo "mock data in the release UI"; exit 1; fi
      - run: cargo build --release --locked -p kora-cli
      - name: Binary reports the Cargo version
        shell: bash
        run: |
          ver="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="kora-cli"))')"
          got="$("target/release/${{ matrix.bin }}" --version | tr -d '\r')"
          echo "cargo=$ver binary='$got'"
          [ "$got" = "kora $ver" ]
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$ver" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo version $ver (run scripts/bump-version.sh)"; exit 1
          fi
      - name: Stage artifact
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.name }}"
          (cd dist && sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*

  package-linux:
    # The .deb (Debian / Ubuntu): the program in /usr/lib/kora, the systemd unit of Kora's administrator
    # service, maintainer scripts. Built with dpkg-deb from the Linux binary built above (no extra tool).
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kora-linux-x86_64
          path: in
      - name: Build the package
        run: |
          chmod +x in/kora-linux-x86_64
          ver="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="kora-cli"))')"
          mkdir dist
          packaging/linux/build-deb.sh in/kora-linux-x86_64 "$ver" dist/kora-linux-x86_64.deb
          (cd dist && sha256sum kora-linux-x86_64.deb > kora-linux-x86_64.deb.sha256)
          dpkg-deb -I dist/kora-linux-x86_64.deb
          dpkg-deb -c dist/kora-linux-x86_64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kora-linux-x86_64.deb
          path: dist/*

  verify:
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  (for the install scripts)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Add the install scripts as release assets
        run: cp scripts/install.sh scripts/install.ps1 dist/
      - name: Every expected asset exists and checksums verify
        working-directory: dist
        run: |
          ls -l
          for f in kora-linux-x86_64 kora-linux-x86_64.sha256 kora-linux-x86_64.deb kora-linux-x86_64.deb.sha256 kora-windows-x86_64.exe kora-windows-x86_64.exe.sha256 install.sh install.ps1; do
            [ -s "$f" ] || { echo "MISSING or empty: $f"; exit 1; }
          done
          sha256sum -c kora-linux-x86_64.sha256
          sha256sum -c kora-linux-x86_64.deb.sha256
          sha256sum -c kora-windows-x86_64.exe.sha256
      - name: Linux binary runs and reports the Cargo version
        run: |
          chmod +x dist/kora-linux-x86_64
          ver="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="kora-cli"))')"
          [ "$(dist/kora-linux-x86_64 --version)" = "kora $ver" ]
      - name: The released .deb installs for real, serves a non-root account, refuses another, and purges clean
        run: KORA_DEB="$PWD/dist/kora-linux-x86_64.deb" KORA_BIN="$PWD/dist/kora-linux-x86_64" scripts/smoke-linux/07-service.sh
      - name: install.sh passes its tests
        run: sh -n scripts/install.sh && bash scripts/test-install.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*

  attest:
    needs: verify
    # Signed build provenance (Sigstore, keyless): anyone can check that a downloaded file was built by
    # this workflow from this repository: `gh attestation verify kora-linux-x86_64 --repo KoraFiveM/kora-installer`.
    # Its own job so the OIDC token never sits next to `contents: write`.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/kora-linux-x86_64
            dist/kora-linux-x86_64.deb
            dist/kora-windows-x86_64.exe
            dist/install.sh
            dist/install.ps1

  publish:
    needs: attest
    # Rehearsals (publish=false, or not on a tag) stop after verify.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  (for RELEASE_NOTES.md)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          draft: true   # TODO: maintainer reviews/approves before publishing
          body_path: ${{ hashFiles('RELEASE_NOTES.md') != '' && 'RELEASE_NOTES.md' || '' }}
          generate_release_notes: ${{ hashFiles('RELEASE_NOTES.md') == '' }}
