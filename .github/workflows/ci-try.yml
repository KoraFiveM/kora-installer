# TEMPORARY (nx/ci-fix): runs only the still-failing Linux jobs on every push of this branch. Removed before the report.
name: ci-try
on:
  push:
    branches: [nx/ci-fix, 'nx/ci-fix-try-*']
concurrency:
  group: ci-try-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  container:
    name: "try: container (${{ matrix.engine }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [podman, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-smoke
      - run: cargo build --release --locked -p kora-cli
      - run: scripts/smoke-linux/08-container.sh "${{ matrix.engine }}"
