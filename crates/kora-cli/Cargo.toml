[package]
name = "kora-cli"
description = "The `kora` command"
version.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "kora"
path = "src/main.rs"

[dependencies]
kora-tui.workspace = true
kora-core.workspace = true
clap = { workspace = true, features = ["env"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
