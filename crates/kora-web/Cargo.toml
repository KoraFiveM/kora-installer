[package]
name = "kora-web"
description = "Kora Panel: local HTTP server (API skeleton, sessions, jobs/SSE, embedded UI)"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
getrandom = "0.4.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", default-features = false }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
