# Kora Framework server configuration. Generated by the Kora installer.
# Secrets (license key, database credentials) live in secrets.cfg only.
exec secrets.cfg

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
sv_hostname "Kora Test Server"
sets sv_projectName "Kora Test Server"
sv_enforceGameBuild 3751
set steam_webApiKey "none"
set resources_useSystemChat true
set chat_showJoins false
set chat_showQuits false
setr qb_locale "en"
sv_scriptHookAllowed 0

exec permissions.cfg

ensure mapmanager
ensure kora_lib
ensure kora_sql
ensure kora_inventory
ensure kora_core
ensure [compat]
ensure [kora]
